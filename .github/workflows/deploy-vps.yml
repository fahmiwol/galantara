# Jalur ini memakai kunci ber-command paksa: hanya bisa memanggil penerima.
# Dipasang dengan tools/deploy/pasang-kunci-ci.sh; lihat docs/DEPLOY.md.
name: Deploy galantara.io

on:
  push:
    branches: [main]
    paths:
      - index.html
      - about.html
      - admin.html
      - benteng.html
      - 'src/**'
      - 'data/**'
      - 'assets/**'
      - 'vendor/**'
      - '.github/workflows/deploy-vps.yml'
      - 'tools/deploy/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Mode deploy
        type: choice
        options: [coba, jalankan]
        default: jalankan
        required: true

concurrency:
  group: deploy-galantara
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Uji lokal
        run: npm test

  deploy:
    needs: uji
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'jalankan' }}
    steps:
      - name: Cek konfigurasi
        id: konfigurasi
        shell: bash
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_PORT" ] && [ -n "$SSH_USER" ] && \
             [ -n "$SSH_KNOWN_HOSTS" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            echo 'siap=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Deploy dilewati: jalankan tools/deploy/pasang-kunci-ci.sh'
            echo 'siap=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.konfigurasi.outputs.siap == 'true'

      - name: Paket dari HEAD
        if: steps.konfigurasi.outputs.siap == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o paket.tgz HEAD index.html about.html admin.html benteng.html src data assets vendor

      - name: Kirim ke penerima
        if: steps.konfigurasi.outputs.siap == 'true'
        shell: bash
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          case "$MODE" in coba|jalankan) ;; *) echo '!! Mode tidak sah.' >&2; exit 2 ;; esac
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/kunci"
          chmod 600 "$RUNNER_TEMP/kunci"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/known_hosts"
          GITHUB_SHA_PENDEK=$(git rev-parse --short HEAD)
          ssh -i "$RUNNER_TEMP/kunci" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$SSH_USER@$SSH_HOST" "$MODE $GITHUB_SHA_PENDEK" < paket.tgz | tee hasil.txt

      - name: Verifikasi HTTPS terhadap blob HEAD
        if: steps.konfigurasi.outputs.siap == 'true' && env.MODE == 'jalankan'
        shell: bash
        run: |
          set -euo pipefail
          : > hasil-verifikasi.txt
          GAGAL=0
          for f in index.html src/main.js src/fisika/Karakter.js; do
            u="/$f"; [ "$f" = index.html ] && u=/
            BLOB=$(git cat-file -p "HEAD:$f" | sha256sum | cut -c1-64)
            if ! LIVE=$(curl -fsS --max-time 30 "https://galantara.io$u" | sha256sum | cut -c1-64); then
              echo "!! $f gagal diambil lewat HTTPS." | tee -a hasil-verifikasi.txt >&2
              GAGAL=1
            elif [ "$BLOB" != "$LIVE" ]; then
              echo "!! $f BERBEDA: blob=$BLOB live=$LIVE" | tee -a hasil-verifikasi.txt >&2
              GAGAL=1
            else
              echo "== $f live = blob HEAD, SHA256 $BLOB" | tee -a hasil-verifikasi.txt
            fi
          done
          exit "$GAGAL"

      - name: Ringkasan hasil
        if: always() && steps.konfigurasi.outputs.siap == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '## Deploy galantara.io — %s\n\n' "$MODE"
            echo '```text'
            if [ -f hasil.txt ]; then cat hasil.txt; else echo '== Hasil penerima belum tersedia.'; fi
            if [ -f hasil-verifikasi.txt ]; then
              cat hasil-verifikasi.txt
            elif [ "$MODE" = coba ]; then
              echo '== Mode coba: verifikasi HTTPS dilewati.'
            else
              echo '!! Verifikasi HTTPS belum dijalankan.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hapus kunci sementara
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/kunci" "$RUNNER_TEMP/known_hosts"
