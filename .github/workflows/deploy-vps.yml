# Deploy statis ke VPS lewat GitHub Actions — HANYA manual (workflow_dispatch).
# GitHub → Settings → Secrets and variables → Actions:
#   SSH_HOST, SSH_PORT (VPS-2: 2222), SSH_USER, SSH_PRIVATE_KEY (PEM lengkap),
#   REMOTE_PATH (mis. /www/wwwroot/galantara.io/)
name: Deploy VPS (static)

# Pemicu otomatis SENGAJA DIMATIKAN — lihat ADR-0007 dan ADR-0018.
#
# Koreksi 16 Sep 2026: alasan awalnya ("belum ada server") SALAH. galantara.io
# hidup di VPS-2 sejak April; SSH-nya di port 2222 dan workflow ini mencoba
# port 22, jadi timeout. SSH_PORT sekarang didukung.
#
# Jalur deploy yang berlaku: tools/deploy-galantara.sh (docs/DEPLOY.md) —
# dengan backup, verifikasi bita, dan penolakan kalau HEAD belum di-push.
# Workflow ini tidak punya keduanya. Menyalakan `push:` berarti menaruh kunci
# server bersama (19 aplikasi) di GitHub Secrets: keputusan Fahmi; kalau
# dinyalakan, pakai user deploy yang hanya bisa menulis web root, bukan root.
#
# on:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rsync to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Hilangkan CRLF dari secret (sering kalau paste dari Notepad Windows)
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pastikan path remote diakhiri /
          REMOTE_PATH="${REMOTE_PATH%/}/"
          SSH_PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH_BASE="-p $SSH_PORT -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o BatchMode=yes"
          DEST="${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}"
          echo "SSH target: ${SSH_USER}@${SSH_HOST}:${SSH_PORT} path=${REMOTE_PATH}"
          echo "Testing SSH (BatchMode, no password prompt)..."
          ssh $SSH_BASE "${SSH_USER}@${SSH_HOST}" "echo ssh_ok"
          echo "Running rsync..."
          rsync -avz -e "ssh $SSH_BASE" ./index.html ./about.html ./admin.html ./benteng.html "$DEST"
          rsync -avz --delete -e "ssh $SSH_BASE" ./src/ "${DEST}src/"
          rsync -avz --delete -e "ssh $SSH_BASE" ./data/ "${DEST}data/"
          # assets/ berisi GLB rumah adat dan manifest tiap Spot. Tanpa baris ini
          # keduanya 404 di live: rumah adat tidak muncul dan Spot gagal memuat
          # manifestnya, padahal di lokal semuanya benar.
          rsync -avz --delete -e "ssh $SSH_BASE" ./assets/ "${DEST}assets/"
          # Pustaka dan font lokal harus ikut agar index tidak bergantung CDN
          # atau gagal boot. Seluruh vendor/ termasuk fonts/ dan lisensinya.
          rsync -avz --delete -e "ssh $SSH_BASE" ./vendor/ "${DEST}vendor/"
          echo "Deploy finished."
